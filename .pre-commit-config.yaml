default_install_hook_types:
  - commit-msg
  - pre-push

repos:
  - repo: local
    hooks:
      - id: commit-msg-check
        name: Valida mensagem de commit (Conventional Commits)
        entry: scripts/hooks/commit-msg.sh
        language: script
        stages: [commit-msg]
        verbose: true

  - repo: local
    hooks:
      - id: docs-build
        name: Testa o build da documentação (mkdocs build --strict)
        entry: scripts/hooks/pre-push-build.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
