default_install_hook_types:
  - commit-msg
  - pre-push

repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: docs-build
        name: Testa o build da documentação (mkdocs build --strict)
        entry: scripts/hooks/pre-push-build.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]
